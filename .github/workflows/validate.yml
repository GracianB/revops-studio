name: validate

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: validate-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run full verification gate
        run: npm run verify

      - name: Install lightweight browser smoke dependency
        run: npm install --no-save --package-lock=false playwright-core@1.58.2

      - name: Real Chrome smoke (desktop and mobile)
        run: node scripts/browser-smoke.mjs
