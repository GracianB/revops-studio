name: validate

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: validate-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run full verification gate
        run: npm run verify

      - name: PR80 integrated synthetic acceptance
        run: npm run pr80:check

      - name: PR99 candidate integrity and release boundary
        run: node scripts/pr99-candidate-audit.mjs

      - name: Upload PR99 technical inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revops-pr99-inventory-${{ github.run_id }}
          path: .ci-artifacts/pr99-candidate-inventory.json
          if-no-files-found: ignore
          retention-days: 30

      - name: PR100 milestone 18-scenario acceptance
        run: node scripts/pr100-milestone-acceptance.mjs

      - name: Upload PR100 technical acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revops-pr100-acceptance-${{ github.run_id }}
          path: .ci-artifacts/pr100-acceptance.json
          if-no-files-found: ignore
          retention-days: 30

      - name: V100 five-surface usability structure audit
        run: node scripts/ux-audit.mjs

      - name: Archive V100 UX audit observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revops-v100-ux-audit-${{ github.run_id }}
          path: .ci-artifacts/v100-ux-audit.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Install lightweight browser smoke dependency
        run: npm install --no-save --package-lock=false playwright-core@1.58.2 eslint@9.39.1 globals@16.5.0 axe-core@4.10.3

      - name: Detect undeclared browser variables
        run: node scripts/lint-globals.mjs

      - name: Real Chrome smoke (desktop and mobile)
        run: node scripts/browser-smoke.mjs

      - name: Synthetic network and CPU performance budgets
        run: node scripts/performance-budget.mjs

      - name: Attach synthetic performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revops-v46-performance-${{ github.run_id }}
          path: .ci-artifacts/performance-v46.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Install Firefox for browser verification
        run: npx playwright-core install firefox

      - name: Real Firefox smoke (desktop and mobile layouts)
        run: REVOPS_BROWSER=firefox node scripts/browser-smoke.mjs
