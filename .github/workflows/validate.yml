name: validate

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: validate-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run full verification gate
        run: npm run verify
