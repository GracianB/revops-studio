name: validate

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: validate-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run full verification gate
        run: npm run verify

      - name: Install lightweight browser smoke dependency
        run: npm install --no-save --package-lock=false playwright-core@1.58.2 eslint@9.39.1 globals@16.5.0 axe-core@4.10.3

      - name: Detect undeclared browser variables
        run: node scripts/lint-globals.mjs

      - name: Real Chrome smoke (desktop and mobile)
        run: REVOPS_VISUAL_AUDIT=1 REVOPS_AXE_DIAGNOSTIC=1 node scripts/browser-smoke.mjs

      - name: Install Firefox for browser verification
        run: npx playwright-core install firefox

      - name: Real Firefox smoke (desktop and mobile layouts)
        run: REVOPS_BROWSER=firefox node scripts/browser-smoke.mjs
